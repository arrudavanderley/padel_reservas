{% extends 'reservas/base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="col-md-5 mx-auto card p-4">
    <h1 class="h4 mb-3">Iniciar sesión</h1>

    {% if form.errors %}
        <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="id_username">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <p class="mt-3 mb-0 text-center">
        ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a>
    </p>
</div>
{% endblock %}

{% extends 'reservas/base.html' %}
{% block title %}Calendario - Padel Almonte{% endblock %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales/es.js"></script>

<div class="max-w-7xl mx-auto px-6 py-10">
  <h1 class="text-3xl font-extrabold mb-2">Calendario de pistas</h1>
  <p class="text-sm text-slate-500 mb-6">Vista semana por defecto • Días arriba • Horas a la izquierda. Haz clic en un hueco para reservar.</p>
  
  <div class="bg-white rounded-2xl border p-4 mb-4 flex gap-2">
    <select id="filtro-pista" class="bg-slate-900 text-white px-4 py-2 rounded-full text-sm">
      <option value="">Todas las pistas</option>
      {% for pista in pistas %}<option value="{{ pista.id }}">{{ pista.nombre }}</option>{% endfor %}
    </select>
    <button onclick="calendar.changeView('dayGridMonth')" class="bg-slate-100 px-3 py-2 rounded-full text-xs">Mes</button>
    <button onclick="calendar.changeView('timeGridWeek')" class="bg-slate-900 text-white px-3 py-2 rounded-full text-xs">Semana</button>
    <button onclick="calendar.changeView('timeGridDay')" class="bg-slate-100 px-3 py-2 rounded-full text-xs">Día</button>
  </div>

  <div class="bg-white rounded-2xl border p-6">
    <div id="calendar"></div>
  </div>
</div>

<div id="modal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/50" onclick="document.getElementById('modal').classList.add('hidden')"></div>
  <div class="relative max-w-sm mx-auto mt-20 bg-white rounded-2xl p-6">
    <h3 class="font-bold mb-4">Nueva reserva</h3>
    <form id="form-reserva" method="post">
      {% csrf_token %}
      <select name="pista" class="w-full border rounded-xl px-3 py-2 mb-3">
        {% for pista in pistas %}<option value="{{ pista.id }}">{{ pista.nombre }}</option>{% endfor %}
      </select>
      <input type="date" name="fecha" id="fecha" class="w-full border rounded-xl px-3 py-2 mb-3" required>
      <input type="time" name="hora_inicio" id="inicio" class="w-full border rounded-xl px-3 py-2 mb-3" required>
      <input type="time" name="hora_fin" id="fin" class="w-full border rounded-xl px-3 py-2 mb-3" required>
      <div id="error" class="hidden text-red-600 text-sm mb-3"></div>
      <button class="w-full bg-slate-900 text-white py-3 rounded-full font-bold">Reservar</button>
    </form>
  </div>
</div>

<script>
let calendar; let filtro="";
document.addEventListener('DOMContentLoaded', function(){
  const el=document.getElementById('calendar');
  calendar=new FullCalendar.Calendar(el,{
    locale:'es',
    initialView:'timeGridWeek',
    headerToolbar:{left:'prev,next today', center:'title', right:'dayGridMonth,timeGridWeek,timeGridDay'},
    slotMinTime:'08:00:00',
    slotMaxTime:'23:00:00',
    allDaySlot:false,
    nowIndicator:true,
    events:function(info, success){
      const params=new URLSearchParams({start:info.startStr.slice(0,10), end:info.endStr.slice(0,10)});
      if(filtro) params.append('pista', filtro);
      fetch('/eventos/?'+params.toString()).then(r=>r.json()).then(d=>success(d));
    },
    dateClick:function(info){
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('fecha').value=info.dateStr.slice(0,10);
      document.getElementById('inicio').value=info.dateStr.slice(11,16);
    }
  });
  calendar.render();
  document.getElementById('filtro-pista').addEventListener('change', e=>{ filtro=e.target.value; calendar.refetchEvents(); });
  
  document.getElementById('form-reserva').addEventListener('submit', e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    fetch('/reservas/crear/', {method:'POST', body:fd, headers:{'X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value}})
    .then(async r=>{ const d=await r.json(); if(!r.ok) throw d; return d; })
    .then(()=>{ alert('¡Reservada!'); location.reload(); })
    .catch(err=>{ 
      const div=document.getElementById('error'); 
      div.classList.remove('hidden'); 
      div.innerText=err.error||'Error';
    });
  });
});
</script>
{% endblock %}

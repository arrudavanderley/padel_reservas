{% extends "admin/base_site.html" %}
{% block extrahead %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales/es.js"></script>
<style>.card{background:white; border-radius:20px; padding:20px; border:1px solid #f1f5f9;}</style>
{% endblock %}
{% block content %}
<div style="max-width:1200px;">
<h1 style="font-size:28px; font-weight:800;">📅 Calendario Admin - 3 vistas</h1>
<p style="color:#64748b; margin-bottom:16px;">Elige vista: Mes / Semana (horas derecha, días arriba) / Día. Aquí ves TODAS las reservas.</p>

<div style="display:flex; gap:10px; margin-bottom:16px;">
<button onclick="calendar.changeView('dayGridMonth')" style="background:#f1f5f9; padding:8px 16px; border-radius:999px; font-weight:700; border:none; cursor:pointer;">📅 Mes</button>
<button onclick="calendar.changeView('timeGridWeek')" style="background:#0f172a; color:white; padding:8px 16px; border-radius:999px; font-weight:700; border:none; cursor:pointer;">📊 Semana (por defecto)</button>
<button onclick="calendar.changeView('timeGridDay')" style="background:#f1f5f9; padding:8px 16px; border-radius:999px; font-weight:700; border:none; cursor:pointer;">☀️ Día</button>
<select id="filtro-pista" style="margin-left:auto; padding:8px 16px; border-radius:999px; border:1px solid #e2e8f0;">
<option value="">Todas las pistas</option>
{% for pista in pistas %}<option value="{{ pista.id }}">{{ pista.nombre }}</option>{% endfor %}
</select>
</div>

<div class="card"><div id="calendar-admin"></div></div>

<div style="margin-top:16px; display:flex; gap:10px;">
<a href="/admin/reservas_app/reserva/dashboard/" style="background:#0f172a; color:white; padding:10px 18px; border-radius:999px; text-decoration:none; font-weight:700;">← Dashboard</a>
<a href="/admin/reservas_app/reserva/ocupacion-hoy/" style="background:#059669; color:white; padding:10px 18px; border-radius:999px; text-decoration:none; font-weight:700;">📊 Ocupación hoy</a>
</div>
</div>

<script>
let calendar;
document.addEventListener('DOMContentLoaded', function(){
    const el = document.getElementById('calendar-admin');
    const filtro = document.getElementById('filtro-pista');
    let pistaFiltro="";
    calendar = new FullCalendar.Calendar(el, {
        locale:'es',
        initialView:'timeGridWeek',
        headerToolbar:{left:'prev,next today', center:'title', right:'dayGridMonth,timeGridWeek,timeGridDay'},
        slotMinTime:'08:00:00',
        slotMaxTime:'23:00:00',
        allDaySlot:false,
        nowIndicator:true,
        height:'auto',
        events:function(info, success, failure){
            const params=new URLSearchParams({start:info.startStr.slice(0,10), end:info.endStr.slice(0,10)});
            if(pistaFiltro) params.append('pista', pistaFiltro);
            fetch(`/eventos/?${params.toString()}`).then(r=>r.json()).then(d=>success(d)).catch(failure);
        },
        eventClick:function(info){
            const p=info.event.extendedProps;
            if(confirm(`Reserva: ${info.event.title}\n${info.event.start.toLocaleString()}\nUsuario: ${p.usuario || ''}\n¿Cancelar?`)){
                fetch(`/reservas/${info.event.id.split('-')[1]}/cancelar/`, {method:'POST', headers:{'X-CSRFToken':'{{ csrf_token }}'}})
                .then(r=>r.json()).then(d=>{
                    if(d.success){ info.event.remove(); alert('Cancelada'); }
                    else alert(d.error);
                });
            }
        }
    });
    calendar.render();
    filtro.addEventListener('change', function(){ pistaFiltro=this.value; calendar.refetchEvents(); });
});
</script>
{% endblock %}

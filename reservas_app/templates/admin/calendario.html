{% extends "admin/base_site.html" %}
{% block extrahead %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/locales/es.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.fc .fc-toolbar-title{font-weight:800; font-size:1.4rem;}
.fc .fc-button{border-radius:999px !important; font-weight:700 !important; font-size:0.85rem !important;}
.fc .fc-button-primary{background:#0f172a !important; border-color:#0f172a !important;}
.fc .fc-event{border-radius:14px !important; border:none !important; padding:6px 10px !important; font-weight:700 !important; box-shadow:0 3px 10px rgba(0,0,0,0.12) !important;}
.fc .fc-col-header-cell{background:#f8fafc !important; font-weight:800 !important; font-size:11px !important; border-color:#f1f5f9 !important;}
.fc .fc-timegrid-slot{border-color:#f8fafc !important; background:white !important; height:38px !important;}
.fc .fc-scrollgrid{border-radius:20px !important; overflow:hidden; border:1px solid #e2e8f0 !important;}
</style>
{% endblock %}
{% block content %}
<div class="max-w-[1250px] mx-auto">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-[26px] font-extrabold">Calendario</h1>
      <p class="text-sm text-slate-500 mt-1"><span class="w-2.5 h-2.5 bg-red-500 rounded-full inline-block mr-1"></span> Reservado <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full inline-block ml-3 mr-1"></span> Libre <span class="w-2.5 h-2.5 bg-blue-600 rounded-full inline-block ml-3 mr-1"></span> Evento</p>
    </div>
    <div class="flex gap-2 bg-white border rounded-full p-1 shadow-sm">
      <button onclick="calendar.changeView('dayGridMonth')" class="px-4 py-2 rounded-full text-sm font-bold hover:bg-slate-100">Mes</button>
      <button onclick="calendar.changeView('timeGridWeek')" class="px-4 py-2 rounded-full text-sm font-bold bg-slate-900 text-white">Semana</button>
      <button onclick="calendar.changeView('timeGridDay')" class="px-4 py-2 rounded-full text-sm font-bold hover:bg-slate-100">Día</button>
    </div>
  </div>
  <div class="bg-white rounded-[24px] border border-slate-200 shadow-sm p-4"><div id="calendar-admin"></div></div>
</div>
<script>
let calendar;
document.addEventListener('DOMContentLoaded', function(){
  const el=document.getElementById('calendar-admin');
  calendar=new FullCalendar.Calendar(el,{
    locale:'es', initialView:'timeGridWeek',
    headerToolbar:{left:'prev,next today', center:'title', right:'dayGridMonth,timeGridWeek,timeGridDay'},
    slotMinTime:'08:00:00', slotMaxTime:'23:00:00', slotDuration:'01:30:00', allDaySlot:false, height:'auto', nowIndicator:true,
    events:function(info, success){
      const p=new URLSearchParams({start:info.startStr.slice(0,10), end:info.endStr.slice(0,10)});
      fetch('/eventos/?'+p.toString()).then(r=>r.json()).then(d=>success(d));
    },
    eventDidMount:function(info){
      if(info.event.extendedProps.tipo==='bloqueo'){ info.el.style.background='#2563eb'; }
      else if(info.event.extendedProps.propia){ info.el.style.background='#10b981'; }
      else { info.el.style.background='#ef4444'; }
      info.el.style.borderRadius='14px';
    }
  });
  calendar.render();
});
</script>
{% endblock %}
